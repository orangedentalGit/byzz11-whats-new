# Veröffentlicht das Deck auf GitHub Pages.
#
# Diese Datei liegt hier in derselben Struktur, in der sie auch im Repository
# stehen muss — publish.bat kopiert sie unverändert nach publish\.github\.
# GitHub erkennt Workflows ausschließlich unter .github/workflows/. Weder eine
# pages.yml in der Wurzel noch ein workflows/ ohne .github wird gefunden, und
# beides bleibt ohne Fehlermeldung: Es läuft dann stillschweigend GitHubs
# eingebauter Workflow weiter.
#
# Anleitung und Fehlerdiagnose: dev/docs/veroeffentlichen.md
#
# Voraussetzung im Repo: Settings -> Pages -> Source steht auf "GitHub Actions".
# Steht dort "Deploy from a branch", läuft ebenfalls der eingebaute Workflow und
# diese Datei wird ignoriert.

name: Deck auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:          # erlaubt einen neuen Anlauf ohne Commit

permissions:
  contents: read
  pages: write
  id-token: write

# Ein Deployment zur Zeit. cancel-in-progress bleibt false: ein laufendes
# Deployment abzubrechen ist genau der Zustand, der die Warteschlange blockiert.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Alle drei Actions laufen auf Node 24. Ältere Hauptversionen lösen die
      # Deprecation-Meldung zu Node 20 aus — sachlich harmlos, aber vermeidbar.
      - name: Repository auschecken
        uses: actions/checkout@v6

      # Ein Job ohne Build-Schritt: das Deck ist bereits fertig, es wird nur
      # verpackt. path: . nimmt das gesamte Repository. Kein Jekyll — der
      # Inhalt geht unverändert raus.
      - name: Deck als Pages-Artefakt packen
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      # Kein timeout: setzen. 600000 ms sind nicht nur die Voreinstellung,
      # sondern das erlaubte Maximum — höhere Werte werden kommentarlos darauf
      # zurückgesetzt ("timeout value is greater than the allowed maximum").
      # Gegen eine hängende Pages-Warteschlange hilft der Parameter also nicht.
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
